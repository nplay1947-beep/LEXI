<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LexiCards</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f1e8;
    --panel: #ffffff;
    --dark: #29251f;
    --muted: #8b857d;
    --border: #e7e1d8;
    --accent: #806548;

    --again: #ead2cd;
    --hard: #eee0c2;
    --good: #d8e6d2;
    --easy: #cfe1e5;
}

body {
    margin: 0;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--dark);
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.hidden {
    display: none !important;
}


/* =========================
   APP
========================= */

.app {
    min-height: 100vh;
    display: flex;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;
    min-height: 100vh;
    background: var(--dark);
    color: white;
    padding: 24px 16px;
    flex-shrink: 0;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    margin: 5px 10px 30px;
}

.logo span {
    opacity: .5;
}

.sidebar-section-title {
    color: rgba(255,255,255,.45);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin: 20px 10px 9px;
}

.folder {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 11px 12px;
    border-radius: 10px;

    margin-bottom: 4px;

    transition: .15s;
}

.folder:hover {
    background: rgba(255,255,255,.07);
}

.folder.active {
    background: #6c5843;
}

.folder-main {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.folder-delete {
    background: transparent;
    color: rgba(255,255,255,.45);
    border: 0;
}

.add-folder {
    width: 100%;
    padding: 11px;
    margin-top: 8px;

    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.1);

    color: white;
    background: rgba(255,255,255,.07);
}

.add-folder:hover {
    background: rgba(255,255,255,.13);
}


/* =========================
   MAIN
========================= */

.main {
    width: 100%;
    max-width: 1200px;
    padding: 38px 42px;
    margin: 0 auto;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    margin-bottom: 30px;
}

.title {
    margin: 0;
    font-size: 34px;
}

.subtitle {
    margin-top: 7px;
    color: var(--muted);
}

.primary {
    border: 0;
    border-radius: 11px;

    padding: 12px 17px;

    background: var(--accent);
    color: white;

    font-weight: 650;
}

.primary:hover {
    filter: brightness(.94);
}


/* =========================
   DECKS
========================= */

.decks {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(270px, 1fr));

    gap: 18px;
}

.deck {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 17px;

    padding: 21px;

    transition: .15s;
}

.deck:hover {
    transform: translateY(-2px);
    box-shadow:
        0 10px 30px rgba(50,40,25,.07);
}

.deck-title {
    font-size: 20px;
    font-weight: 750;

    margin-bottom: 7px;
}

.deck-meta {
    color: var(--muted);
    font-size: 14px;

    margin-bottom: 18px;
}

.progress {
    height: 7px;
    background: #ece8e2;
    border-radius: 100px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width .3s;
}

.deck-stats {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 17px;
}

.deck-stat {
    text-align: center;
    background: #f8f5ef;
    border-radius: 9px;
    padding: 8px 3px;
}

.deck-stat-number {
    font-weight: 750;
}

.deck-stat-label {
    font-size: 11px;
    color: var(--muted);
}

.deck-actions {
    display: flex;
    gap: 8px;
    margin-top: 17px;
}

.deck-actions button {
    flex: 1;
    border: 0;
    border-radius: 9px;
    padding: 9px 8px;
}

.study-btn {
    background: var(--dark);
    color: white;
}

.secondary {
    background: #eeeae3;
    color: var(--dark);
}

.danger {
    color: #a15e56;
}


/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;
    padding: 90px 20px;
    color: var(--muted);
}

.empty-icon {
    font-size: 52px;
    margin-bottom: 15px;
}


/* =========================
   DECK VIEW
========================= */

.deck-view {
    display: none;
}

.deck-view.show {
    display: block;
}

.deck-view-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.back-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 0;
    margin-bottom: 10px;
}

.card-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.card-row {
    display: grid;
    grid-template-columns: 1fr 1fr 110px 90px;
    align-items: center;
    gap: 15px;

    background: white;
    border: 1px solid var(--border);

    padding: 14px 16px;

    border-radius: 11px;
}

.card-front {
    font-weight: 650;
}

.card-back {
    color: var(--muted);
}

.card-status {
    font-size: 12px;
}

.card-buttons {
    display: flex;
    gap: 5px;
}

.card-buttons button {
    border: 0;
    background: transparent;
    padding: 5px;
}


/* =========================
   STUDY SCREEN
========================= */

.study-screen {
    position: fixed;
    inset: 0;

    background: var(--bg);

    z-index: 100;

    display: none;

    padding: 25px;
}

.study-screen.show {
    display: block;
}

.study-container {
    max-width: 760px;
    margin: 0 auto;
}

.study-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.study-deck-name {
    font-weight: 750;
}

.close-study {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 10px;

    background: #ebe6de;

    font-size: 22px;
}

.study-progress {
    margin-top: 30px;
}

.study-progress-text {
    display: flex;
    justify-content: space-between;

    color: var(--muted);
    font-size: 14px;
}

.study-progress-track {
    height: 7px;
    background: #e3ded5;

    border-radius: 100px;

    margin-top: 8px;

    overflow: hidden;
}

.study-progress-fill {
    height: 100%;
    background: var(--accent);

    transition: width .2s;
}


/* =========================
   FLASHCARD
========================= */

.flashcard {
    height: 440px;

    margin-top: 25px;

    background: white;

    border: 1px solid var(--border);
    border-radius: 25px;

    box-shadow:
        0 15px 45px rgba(50,40,25,.08);

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 40px;

    cursor: pointer;

    user-select: none;
}

.flashcard-inner {
    width: 100%;
}

.flashcard-label {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
}

.flashcard-word {
    font-size: 48px;
    font-weight: 800;

    word-break: break-word;
}

.flashcard-answer {
    margin-top: 25px;

    font-size: 28px;
    color: var(--accent);

    font-weight: 650;
}

.flashcard-hint {
    margin-top: 28px;

    font-size: 13px;
    color: var(--muted);
}

.answer-controls {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

    margin-top: 18px;
}

.answer-controls button {
    border: 0;

    border-radius: 12px;

    padding: 13px 7px;

    font-weight: 700;
}

.again {
    background: var(--again);
}

.hard {
    background: var(--hard);
}

.good {
    background: var(--good);
}

.easy {
    background: var(--easy);
}

.answer-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    opacity: .65;

    margin-top: 3px;
}


/* =========================
   STATS
========================= */

.stats-grid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 17px;
}

.stat-number {
    font-size: 25px;
    font-weight: 800;
}

.stat-label {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
}


/* =========================
   MODAL
========================= */

.modal-bg {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.45);

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    z-index: 200;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 470px;

    background: white;

    border-radius: 18px;

    padding: 25px;
}

.modal h2 {
    margin: 0 0 20px;
}

.input {
    width: 100%;

    border: 1px solid #ddd6cc;

    border-radius: 10px;

    padding: 12px 13px;

    margin-bottom: 11px;

    outline: none;
}

.input:focus {
    border-color: var(--accent);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;

    gap: 8px;

    margin-top: 10px;
}

.cancel {
    border: 0;
    background: #eeeae3;

    padding: 11px 16px;
    border-radius: 9px;
}


/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity: 0;

    pointer-events: none;

    background: var(--dark);
    color: white;

    padding: 11px 17px;

    border-radius: 10px;

    transition: .25s;

    z-index: 500;
}

.toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width: 800px) {

    .sidebar {
        width: 210px;
    }

    .main {
        padding: 25px 18px;
    }

    .card-row {
        grid-template-columns:
            1fr 1fr;
    }

    .stats-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .flashcard-word {
        font-size: 36px;
    }
}

@media(max-width: 600px) {

    .app {
        display: block;
    }

    .sidebar {
        width: 100%;
        min-height: auto;
    }

    .folders-container {
        display: flex;
        overflow-x: auto;
    }

    .answer-controls {
        grid-template-columns:
            repeat(2, 1fr);
    }
}

</style>
</head>


<body>


<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            Lexi<span>Cards</span>
        </div>

        <div class="sidebar-section-title">
            Папки
        </div>

        <div id="folders"></div>

        <button
            class="add-folder"
            onclick="openFolderModal()"
        >
            + Новая папка
        </button>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <!-- HOME -->

        <section id="homeView">

            <div class="topbar">

                <div>
                    <h1
                        class="title"
                        id="pageTitle"
                    >
                        Мои слова
                    </h1>

                    <div
                        class="subtitle"
                        id="pageSubtitle"
                    >
                        Учите слова с интервальным повторением
                    </div>
                </div>

                <button
                    class="primary"
                    onclick="openDeckModal()"
                >
                    + Новая группа
                </button>

            </div>


            <div
                id="globalStats"
                class="stats-grid"
            ></div>


            <div
                id="decks"
                class="decks"
            ></div>

        </section>


        <!-- DECK VIEW -->

        <section
            id="deckView"
            class="deck-view"
        >

            <button
                class="back-btn"
                onclick="showHome()"
            >
                ← Назад
            </button>

            <div class="deck-view-header">

                <div>

                    <h1
                        class="title"
                        id="deckViewTitle"
                    ></h1>

                    <div
                        class="subtitle"
                        id="deckViewSubtitle"
                    ></div>

                </div>

                <div>

                    <button
                        class="secondary"
                        onclick="openCardModal()"
                    >
                        + Добавить слово
                    </button>

                    <button
                        class="primary"
                        onclick="startStudyFromCurrentDeck()"
                    >
                        Учить
                    </button>

                </div>

            </div>

            <div
                id="cardList"
                class="card-list"
            ></div>

        </section>

    </main>

</div>


<!-- =========================
     FOLDER MODAL
========================= -->

<div
    id="folderModal"
    class="modal-bg"
>

    <div class="modal">

        <h2>Новая папка</h2>

        <input
            id="folderName"
            class="input"
            placeholder="Например: Китайский"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeModals()"
            >
                Отмена
            </button>

            <button
                class="primary"
                onclick="createFolder()"
            >
                Создать
            </button>

        </div>

    </div>

</div>


<!-- =========================
     DECK MODAL
========================= -->

<div
    id="deckModal"
    class="modal-bg"
>

    <div class="modal">

        <h2>Новая группа слов</h2>

        <input
            id="deckName"
            class="input"
            placeholder="Например: HSK 1 — Урок 1"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeModals()"
            >
                Отмена
            </button>

            <button
                class="primary"
                onclick="createDeck()"
            >
                Создать
            </button>

        </div>

    </div>

</div>


<!-- =========================
     CARD MODAL
========================= -->

<div
    id="cardModal"
    class="modal-bg"
>

    <div class="modal">

        <h2 id="cardModalTitle">
            Новая карточка
        </h2>

        <input
            id="cardFront"
            class="input"
            placeholder="Слово"
        >

        <input
            id="cardBack"
            class="input"
            placeholder="Перевод"
        >

        <input
            id="cardExample"
            class="input"
            placeholder="Пример предложения (необязательно)"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeModals()"
            >
                Отмена
            </button>

            <button
                class="primary"
                onclick="saveCard()"
            >
                Сохранить
            </button>

        </div>

    </div>

</div>


<!-- =========================
     STUDY SCREEN
========================= -->

<div
    id="studyScreen"
    class="study-screen"
>

    <div class="study-container">

        <div class="study-header">

            <div
                id="studyDeckName"
                class="study-deck-name"
            ></div>

            <button
                class="close-study"
                onclick="closeStudy()"
            >
                ×
            </button>

        </div>


        <div class="study-progress">

            <div class="study-progress-text">

                <span id="studyCounter">
                    0 / 0
                </span>

                <span id="studyDueText">
                    0 осталось
                </span>

            </div>

            <div class="study-progress-track">

                <div
                    id="studyProgressFill"
                    class="study-progress-fill"
                ></div>

            </div>

        </div>


        <div
            id="flashcard"
            class="flashcard"
            onclick="flipCard()"
        >

            <div class="flashcard-inner">

                <div
                    id="flashcardLabel"
                    class="flashcard-label"
                >
                    Слово
                </div>

                <div
                    id="flashcardWord"
                    class="flashcard-word"
                ></div>

                <div
                    id="flashcardAnswer"
                    class="flashcard-answer hidden"
                ></div>

                <div
                    id="flashcardExample"
                    class="flashcard-answer hidden"
                    style="font-size:17px;color:#777"
                ></div>

                <div
                    id="flashcardHint"
                    class="flashcard-hint"
                >
                    Нажмите на карточку или Space
                </div>

            </div>

        </div>


        <div
            id="answerControls"
            class="answer-controls hidden"
        >

            <button
                class="again"
                onclick="rateCurrentCard('again')"
            >
                Again
                <span
                    class="answer-label"
                    id="againTime"
                ></span>
            </button>

            <button
                class="hard"
                onclick="rateCurrentCard('hard')"
            >
                Hard
                <span
                    class="answer-label"
                    id="hardTime"
                ></span>
            </button>

            <button
                class="good"
                onclick="rateCurrentCard('good')"
            >
                Good
                <span
                    class="answer-label"
                    id="goodTime"
                ></span>
            </button>

            <button
                class="easy"
                onclick="rateCurrentCard('easy')"
            >
                Easy
                <span
                    class="answer-label"
                    id="easyTime"
                ></span>
            </button>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>

/* =========================================================
   DATABASE
========================================================= */

const STORAGE_KEY = "lexicards_database_v1";

let db = loadDatabase();

let currentFolderId =
    db.folders[0]?.id || null;

let currentDeckId = null;

let editingCardId = null;


/* =========================================================
   STUDY STATE
========================================================= */

let study = {

    active: false,

    deckId: null,

    cards: [],

    index: 0,

    flipped: false,

    reviewed: 0,

    total: 0

};


/* =========================================================
   DATABASE STRUCTURE
========================================================= */

function createInitialDatabase() {

    const folderId =
        crypto.randomUUID();

    return {

        version: 1,

        settings: {

            dailyNewLimit: 20,

            dailyReviewLimit: 100

        },

        folders: [

            {

                id: folderId,

                name: "Мои слова",

                decks: []

            }

        ]

    };

}


function loadDatabase() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved)
            return createInitialDatabase();

        const parsed =
            JSON.parse(saved);

        if (!parsed.folders)
            return createInitialDatabase();

        return parsed;

    } catch (error) {

        console.error(error);

        return createInitialDatabase();

    }

}


function saveDatabase() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(db)

    );

}


/* =========================================================
   HELPERS
========================================================= */

function now() {

    return Date.now();

}


function getFolder(id) {

    return db.folders.find(
        folder => folder.id === id
    );

}


function getCurrentFolder() {

    return getFolder(currentFolderId);

}


function getDeck(folder, id) {

    return folder?.decks.find(
        deck => deck.id === id
    );

}


function getCurrentDeck() {

    return getDeck(
        getCurrentFolder(),
        currentDeckId
    );

}


function days(ms) {

    return Math.round(
        ms / 86400000
    );

}


function formatInterval(ms) {

    if (ms < 60000)
        return "< 1 мин";

    if (ms < 3600000)
        return Math.round(ms / 60000) + " мин";

    if (ms < 86400000)
        return Math.round(ms / 3600000) + " ч";

    if (ms < 2592000000)
        return Math.round(ms / 86400000) + " д";

    if (ms < 31536000000)
        return Math.round(ms / 2592000000) + " мес";

    return Math.round(ms / 31536000000) + " г";

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* =========================================================
   CARD DEFAULTS
========================================================= */

function createCardObject(front, back, example = "") {

    return {

        id: crypto.randomUUID(),

        front,

        back,

        example,

        createdAt: now(),

        /*
            Leitner / SM-2 style fields
        */

        state: "new",

        reviews: 0,

        lapses: 0,

        correct: 0,

        incorrect: 0,

        interval: 0,

        ease: 2.5,

        due: now(),

        lastReviewed: null

    };

}


/* =========================================================
   FOLDERS
========================================================= */

function renderFolders() {

    const container =
        document.getElementById("folders");

    container.innerHTML = "";

    db.folders.forEach(folder => {

        const div =
            document.createElement("div");

        div.className =
            "folder " +
            (folder.id === currentFolderId
                ? "active"
                : "");

        div.innerHTML = `

            <div
                class="folder-main"
                onclick="selectFolder('${folder.id}')"
            >

                <span>📁</span>

                <span>
                    ${escapeHTML(folder.name)}
                </span>

            </div>

            <button
                class="folder-delete"
                onclick="deleteFolder('${folder.id}', event)"
            >
                ×
            </button>

        `;

        container.appendChild(div);

    });

}


function selectFolder(id) {

    currentFolderId = id;

    currentDeckId = null;

    showHome();

    renderFolders();

    renderHome();

}


function openFolderModal() {

    document
        .getElementById("folderModal")
        .classList.add("show");

    document
        .getElementById("folderName")
        .focus();

}


function createFolder() {

    const input =
        document.getElementById("folderName");

    const name =
        input.value.trim();

    if (!name)
        return;

    const folder = {

        id: crypto.randomUUID(),

        name,

        ).length;

        deck.cards.filter(

                card.state !== "new" &&
                card.due <= now()
        ).length;

    const learned =
        deck.cards.filter(
            card =>
                card.state === "review" &&
                card.interval >= 86400000
        ).length;

    const percent =
        total === 0
            ? 0
            : Math.round(
                learned / total * 100
            );

    const div =
        document.createElement("div");

    div.className = "deck";

    div.innerHTML = `

            </div>

            <div class="deck-stat">

                <div class="deck-stat-number">
                    ${learned}
                </div>

                <div class="deck-stat-label">
                    изучено
                </div>

            </div>

        </div>

        <div class="deck-actions">

            <button

/* =========================================================
   ANKI-LIKE SCHEDULER
========================================================= */

/*
    Это упрощённая система интервального повторения.

    New:
        Good -> 1 день
        Easy -> 4 дня

    Learning:
        Again -> 10 минут
        Hard -> 30 минут
        Good -> 1 день
        Easy -> 4 дня

    Review:
        Again -> lapse, 10 минут
        Hard -> interval × 1.2
        Good -> interval × ease
        Easy -> interval × ease × 1.3
*/


function scheduleCard(card, rating) {

    const currentTime =
        now();


    /* =====================
       AGAIN
    ===================== */

    if (rating === "again") {

        card.incorrect++;

        if (card.state === "review") {

            card.lapses++;

        }

        card.state =
            "learning";

        card.interval = 0;

        card.due =
            currentTime +
            10 * 60 * 1000;

        card.ease =
            Math.max(
                1.3,
                card.ease - .2
            );

        return;

    }


    /* =====================
       HARD
    ===================== */

    if (rating === "hard") {

        if (card.state === "new") {

            card.state =
                "learning";

            card.interval = 0;

            card.due =
                currentTime +
                30 * 60 * 1000;

        }

        else if (
            card.state === "learning"
        ) {

            card.due =
                currentTime +
                30 * 60 * 1000;

        }

        else {

            const oldInterval =
                Math.max(
                    1,
                    card.interval
                );

            const newInterval =
                Math.max(
                    1,
                    oldInterval * 1.2
                );

            card.interval =
                newInterval;

            card.due =
                currentTime +
                newInterval *
                86400000;

        }

        card.ease =
            Math.max(
                1.3,
                card.ease - .15
            );

        card.reviews++;

        card.incorrect++;

        card.lastReviewed =
            currentTime;

        return;

    }


    /* =====================
       GOOD
    ===================== */

    if (rating === "good") {

        card.correct++;

        card.reviews++;

        card.lastReviewed =
            currentTime;


        if (
            card.state === "new" ||
            card.state === "learning"
        ) {

            card.state =
                "review";

            card.interval =
                1;

        }

        else {

            card.interval =
                Math.max(
                    card.interval + 1,
                    card.interval * card.ease
                );

        }

        card.due =
            currentTime +
            card.interval *
            86400000;

        return;

    }


    /* =====================
       EASY
    ===================== */

    if (rating === "easy") {

        card.correct++;

        card.reviews++;

        card.lastReviewed =
            currentTime;


        if (
            card.state === "new" ||
            card.state === "learning"
        ) {

            card.state =
                "review";

            card.interval =
                4;

        }

        else {

            card.interval =
                Math.max(
                    card.interval + 2,
                    card.interval *
                    card.ease *
                    1.3
                );

        }

        card.ease += .15;

        card.due =
            currentTime +
            card.interval *
            86400000;

    }

}


/* =========================================================
   STUDY SESSION
========================================================= */

function getStudyCards(deck) {

    const currentTime =
        now();

    /*
        Сначала due карточки,
        потом новые.
    */

    const due =
        deck.cards.filter(
            card =>
                card.state !== "new" &&
                card.due <= currentTime
        );

    const fresh =
        deck.cards.filter(
            card =>
                card.state === "new"
        );

    /*
        Сначала старые карточки.
    */

    due.sort(
        (a,b) =>
            a.due - b.due
    );

    /*
        Новые перемешиваем.
    */

    shuffle(fresh);

    return [
        ...due,
        ...fresh
    ];

}


function startStudy(deckId) {

    const folder =
        getCurrentFolder();

    const deck =
        getDeck(folder, deckId);

    if (!deck)
        return;

    const cards =
        getStudyCards(deck);

    if (cards.length === 0) {

        toast(
            "На сегодня карточек нет 🎉"
        );

        return;

    }

    study = {

        active: true,

        deckId,

        cards,

        index: 0,

        flipped: false,

        reviewed: 0,

        total: cards.length

    };

    document
        .getElementById("studyScreen")
        .classList.add("show");

    document
        .getElementById("studyDeckName")
        .textContent =
        deck.name;

    showStudyCard();

}


function startStudyFromCurrentDeck() {

    if (!currentDeckId)
        return;

    startStudy(
        currentDeckId
    );

}


/* =========================================================
   SHOW STUDY CARD
========================================================= */

function showStudyCard() {

    if (
        study.index >=
        study.cards.length
    ) {

        finishStudy();

        return;

    }

    const card =
        study.cards[study.index];

    study.flipped = false;

    document
        .getElementById("flashcardLabel")
        .textContent =
        "Слово";

    document
        .getElementById("flashcardWord")
        .textContent =
        card.front;

    document
        .getElementById("flashcardAnswer")
        .textContent =
        card.back;

    document
        .getElementById("flashcardExample")
        .textContent =
        card.example
            ? card.example
            : "";

    document
        .getElementById("flashcardAnswer")
        .classList.add("hidden");

    document
        .getElementById("flashcardExample")
        .classList.add("hidden");

    document
        .getElementById("flashcardHint")
        .classList.remove("hidden");

    document
        .getElementById("answerControls")
        .classList.add("hidden");


    const current =
        study.index + 1;

    const total =
        study.cards.length;

    document
        .getElementById("studyCounter")
        .textContent =
        `${current} / ${total}`;

    document
        .getElementById("studyDueText")
        .textContent =
        `${total - study.index} осталось`;

    document
        .getElementById("studyProgressFill")
        .style.width =
        `${study.index / total * 100}%`;

}


/* =========================================================
   FLIP
========================================================= */

function flipCard() {

    if (!study.active)
        return;

    if (study.flipped)
        return;

    study.flipped = true;

    const card =
        study.cards[study.index];

    document
        .getElementById("flashcardLabel")
        .textContent =
        "Перевод";

    document
        .getElementById("flashcardAnswer")
        .classList.remove("hidden");

    if (card.example) {

        document
            .getElementById("flashcardExample")
            .classList.remove("hidden");

    }

    document
        .getElementById("flashcardHint")
        .classList.add("hidden");

    document
        .getElementById("answerControls")
        .classList.remove("hidden");

    updateAnswerTimes();

}


/* =========================================================
   ANSWER TIMES
========================================================= */

function updateAnswerTimes() {

    const card =
        study.cards[study.index];

    if (!card)
        return;


    document
        .getElementById("againTime")
        .textContent =
        "10 мин";

    document
        .getElementById("hardTime")
        .textContent =
        getHardInterval(card);

    document
        .getElementById("goodTime")
        .textContent =
        getGoodInterval(card);

    document
        .getElementById("easyTime")
        .textContent =
        getEasyInterval(card);

}


function getHardInterval(card) {

    if (
        card.state === "new" ||
        card.state === "learning"
    ) {

        return "30 мин";

    }

    return formatInterval(
        Math.max(
            86400000,
            card.interval *
            1.2 *
            86400000
        )
    );

}


function getGoodInterval(card) {

    if (
        card.state === "new" ||
        card.state === "learning"
    ) {

        return "1 день";

    }

    return formatInterval(
        Math.max(
            86400000,
            card.interval *
            card.ease *
            86400000
        )
    );

}


function getEasyInterval(card) {

    if (
        card.state === "new" ||
        card.state === "learning"
    ) {

        return "4 дня";

    }

    return formatInterval(
        Math.max(
            86400000,
            card.interval *
            card.ease *
            1.3 *
            86400000
        )
    );

}


/* =========================================================
   RATE CARD
========================================================= */

function rateCurrentCard(rating) {

    if (!study.flipped) {

        flipCard();

        return;

    }

    const currentCard =
        study.cards[study.index];

    const folder =
        getCurrentFolder();

    const deck =
        getDeck(
            folder,
            study.deckId
        );

    if (!deck)
        return;

    const realCard =
        deck.cards.find(
            card =>
                card.id ===
                currentCard.id
        );

    if (!realCard)
        return;


    /*
        Если Again —
        карточка возвращается
        в конец текущей сессии.

        Это очень важная часть
        интервального обучения.
    */

    scheduleCard(
        realCard,
        rating
    );

    study.reviewed++;

    saveDatabase();


    if (rating === "again") {

        /*
            Добавляем копию
            в конец сессии.

            Пользователь увидит
            её снова позже.
        */

        study.cards.push(
            realCard
        );

    }


    study.index++;

    showStudyCard();

}


/* =========================================================
   FINISH STUDY
========================================================= */

function finishStudy() {

    study.active = false;

    document
        .getElementById("studyProgressFill")
        .style.width = "100%";

    setTimeout(() => {

        document
            .getElementById("studyScreen")
            .classList.remove("show");

        renderHome();

        if (currentDeckId)
            renderDeckView();

        toast(
            `Сессия завершена · ${study.reviewed} повторений`
        );

    }, 300);

}


function closeStudy() {

    study.active = false;

    document
        .getElementById("studyScreen")
        .classList.remove("show");

    renderHome();

}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


/* =========================================================
   MODALS
========================================================= */

function closeModals() {

    document
        .querySelectorAll(".modal-bg")
        .forEach(
            modal =>
                modal.classList.remove("show")
        );

    editingCardId = null;

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message) {

    const element =
        document.getElementById("toast");

    element.textContent =
        message;

    element.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () =>
                element.classList.remove("show"),
            2200
        );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
            Escape
        */

        if (event.key === "Escape") {

            closeModals();

            if (study.active)
                closeStudy();

        }


        /*
            Space = flip
        */

        if (
            study.active &&
            event.code === "Space"
        ) {

            event.preventDefault();

            flipCard();

        }


        /*
            1-4 = rating
        */

        if (
            study.active &&
            study.flipped
        ) {

            if (event.key === "1")
                rateCurrentCard("again");

            if (event.key === "2")
                rateCurrentCard("hard");

            if (event.key === "3")
                rateCurrentCard("good");

            if (event.key === "4")
                rateCurrentCard("easy");

        }

    }
);


/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

document
    .querySelectorAll(".modal-bg")
    .forEach(
        modal => {

            modal.addEventListener(
                "click",
                event => {

                    if (
                        event.target === modal
                    ) {

                        closeModals();

                    }

                }
            );

        }
    );


/* =========================================================
   INITIAL RENDER
========================================================= */

renderFolders();

renderHome();

</script>
